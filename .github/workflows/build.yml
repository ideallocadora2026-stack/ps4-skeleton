name: Build Geometric Wars Native PS4 PKG

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN_VERSION: v0.5.4
  TOOLCHAIN_SHA256: 3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld curl ca-certificates make

      - name: Download verified OpenOrbis Toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openorbis"
          curl -fL --retry 3 \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/${TOOLCHAIN_VERSION}/toolchain-llvm-18.tar.gz" \
            -o "$RUNNER_TEMP/openorbis/toolchain.tar.gz"
          echo "${TOOLCHAIN_SHA256}  $RUNNER_TEMP/openorbis/toolchain.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/openorbis/toolchain.tar.gz" -C "$RUNNER_TEMP/openorbis"

          create_fself="$(find "$RUNNER_TEMP/openorbis" -type f -path '*/bin/linux/create-fself' -print -quit)"
          test -n "$create_fself"
          toolchain_root="$(cd "$(dirname "$create_fself")/../.." && pwd)"
          echo "OO_PS4_TOOLCHAIN=$toolchain_root" >> "$GITHUB_ENV"
          chmod +x "$toolchain_root/bin/linux/"*
          test -x "$toolchain_root/bin/linux/create-fself"
          test -x "$toolchain_root/bin/linux/create-gp4"
          test -x "$toolchain_root/bin/linux/PkgTool.Core"
          test -s "$toolchain_root/include/SDL2/SDL.h"
          test -s "$toolchain_root/lib/libSDL2.a"

      - name: Verify native project inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s src/main.cpp
          test -s src/game.cpp
          test -s src/draw.cpp
          test -s src/audio.cpp
          test -s src/third_party/dr_mp3.h
          for file in assets/audio/music/general_{1..5}.mp3 assets/audio/music/boss.mp3 assets/audio/music/shop.mp3 \
                      assets/audio/sfx/coin_{1,2}.mp3 assets/audio/sfx/grenade.mp3 assets/audio/sfx/boss_destroyed.mp3 \
                      assets/audio/sfx/player_damage.mp3 assets/audio/sfx/heart.mp3; do
            test -s "$file"
          done
          test -s sce_sys/icon0.png
          test -s sce_sys/pic0.png
          test -s sce_sys/pic1.png
          test -s sce_sys/about/right.sprx
          test -s sce_module/libc.prx
          test -s sce_module/libSceFios2.prx
          if grep -R "LaunchWebBrowser\|127.0.0.1:8088\|index.html" src; then
            echo "O executavel ainda contem codigo do navegador."
            exit 1
          fi

      - name: Build native eboot and PKG
        shell: bash
        run: |
          set -euo pipefail
          make all
          test -s eboot.bin
          test -s IV0000-GEOM00001_00-GEOMETRICWARS000.pkg
          if grep -q "index.html\|script.js\|style.css" pkg.gp4; then
            echo "O PKG nativo nao deve empacotar o jogo web."
            exit 1
          fi

      - name: Validate generated PKG
        shell: bash
        run: |
          set -euo pipefail
          pkg_file="IV0000-GEOM00001_00-GEOMETRICWARS000.pkg"
          "$OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core" pkg_validate --verbose "$pkg_file"

      - name: Collect result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp IV0000-GEOM00001_00-GEOMETRICWARS000.pkg output/Geometric-Wars-Complete-v1.22.pkg
          sha256sum output/Geometric-Wars-Complete-v1.22.pkg > output/Geometric-Wars-Complete-v1.22.pkg.sha256
          ls -lh output/Geometric-Wars-Complete-v1.22.pkg
          cat output/Geometric-Wars-Complete-v1.22.pkg.sha256

      - name: Upload native PS4 package
        uses: actions/upload-artifact@v4
        with:
          name: Geometric-Wars-Native-PS4
          path: |
            output/Geometric-Wars-Complete-v1.22.pkg
            output/Geometric-Wars-Complete-v1.22.pkg.sha256
          if-no-files-found: error
          retention-days: 30
