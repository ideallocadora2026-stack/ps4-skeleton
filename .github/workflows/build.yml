name: Build Boyceta PS4 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install OpenOrbis Toolchain
      run: |
        ASSET_URL=$(curl -s https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest \
          | grep "browser_download_url" | grep -v ".exe" | grep -v ".pkg" \
          | head -1 | cut -d '"' -f 4)
        echo "Downloading: $ASSET_URL"
        curl -L "$ASSET_URL" -o toolchain.tar.gz
        mkdir -p $HOME/OpenOrbis
        tar -xzf toolchain.tar.gz -C $HOME/OpenOrbis
        echo "=== Directory structure ==="
        ls $HOME/OpenOrbis/
        # Find OpenOrbis.mk to get correct root
        ORBIS_MK=$(find $HOME/OpenOrbis -name "OpenOrbis.mk" | head -1)
        echo "Found OpenOrbis.mk at: $ORBIS_MK"
        OPENORBIS_PATH=$(dirname $(dirname $(dirname $ORBIS_MK)))
        echo "OPENORBIS=$OPENORBIS_PATH" >> $GITHUB_ENV
        echo "PATH=$OPENORBIS_PATH/bin:$PATH" >> $GITHUB_ENV
        echo "Set OPENORBIS to: $OPENORBIS_PATH"

    - name: Build eboot.bin
      run: |
        echo "OPENORBIS=$OPENORBIS"
        ls $OPENORBIS/
        make

    - name: Install create-gp4
      run: |
        ASSET_URL=$(curl -s https://api.github.com/repos/OpenOrbis/create-gp4/releases/latest \
          | grep "browser_download_url" | grep -i "linux" | head -1 | cut -d '"' -f 4)
        echo "Downloading: $ASSET_URL"
        curl -L "$ASSET_URL" -o /usr/local/bin/create-gp4
        chmod +x /usr/local/bin/create-gp4

    - name: Create PKG
      run: |
        mkdir -p output
        create-gp4 \
          --content-id "IV0001-BOYC00001_00-0000000000000000" \
          --title "Boyceta PS4" \
          --title-id "BOYC00001" \
          --version "01.00" \
          --app-ver "01.00" \
          --target output/Boyceta-ps4.pkg \
          eboot.bin \
          sce_sys/param.sfo \
          sce_sys/keystone \
          sce_sys/icon0.png \
          Boyceta-ps4/index.html \
          Boyceta-ps4/script.js \
          Boyceta-ps4/style.css

    - name: Upload PKG
      uses: actions/upload-artifact@v4
      with:
        name: Boyceta-PS4-PKG
        path: output/Boyceta-ps4.pkg
        retention-days: 30
