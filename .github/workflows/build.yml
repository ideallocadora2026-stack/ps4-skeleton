name: Build Boyceta PS4 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Compiler
      run: sudo apt-get update && sudo apt-get install -y clang lld curl

    - name: Download OpenOrbis Toolchain
      run: |
        ASSET_URL=$(curl -s https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest | grep "browser_download_url" | grep -v ".exe" | grep -v ".pkg" | head -1 | cut -d '"' -f 4)
        curl -L "$ASSET_URL" -o toolchain.tar.gz
        mkdir -p $HOME/OpenOrbis
        tar -xzf toolchain.tar.gz -C $HOME/OpenOrbis --strip-components=1
        echo "OO_PS4_TOOLCHAIN=$HOME/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV
        chmod +x $HOME/OpenOrbis/PS4Toolchain/bin/linux/*

    - name: Build eboot.bin
      run: |
        clang++ --target=x86_64-pc-freebsd12-elf -fPIC -funwind-tables -c -isysroot $OO_PS4_TOOLCHAIN -isystem $OO_PS4_TOOLCHAIN/include -isystem $OO_PS4_TOOLCHAIN/include/c++/v1 -o main.o src/main.cpp
        ld.lld -m elf_x86_64 -pie --script $OO_PS4_TOOLCHAIN/link.x --eh-frame-hdr -L$OO_PS4_TOOLCHAIN/lib -lc -lkernel -lc++ -lSceSystemService $OO_PS4_TOOLCHAIN/lib/crt1.o main.o -o main.elf
        $OO_PS4_TOOLCHAIN/bin/linux/create-fself -in=main.elf -out=main.oelf --eboot "eboot.bin" --paid 0x3800000000000011

    - name: Create PKG
      run: |
        # 1. Copiar apenas o param.sfo original e limpo
        mkdir -p sce_sys
        cp Boyceta-ps4/sce_sys/param.sfo sce_sys/param.sfo
        
        # 2. Atualizar o nome e o ID (O keystone original foi removido por incompatibilidade de ID)
        $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core sfo_setentry sce_sys/param.sfo CONTENT_ID --type Utf8 --maxsize 48 --value 'IV0001-GEOM00001_00-0000000000000000'
        $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core sfo_setentry sce_sys/param.sfo TITLE --type Utf8 --maxsize 128 --value 'Geometric Wars'
        $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core sfo_setentry sce_sys/param.sfo TITLE_ID --type Utf8 --maxsize 12 --value 'GEOM00001'
        
        # 3. Pegar os arquivos do jogo
        cp Boyceta-ps4/index.html index.html || true
        cp Boyceta-ps4/script.js script.js || true
        cp Boyceta-ps4/style.css style.css || true
        
        # 4. Criar o descritor GP4 perfeito manualmente com Passcode de FakePKG e SEM o keystone
        cat << 'EOF' > GeometricWars.gp4
        <?xml version="1.0" encoding="utf-8" standalone="yes"?>
        <ps4_project fmt="ext" version="1.48">
          <volume>
            <volume_type>pkg_ps4_app</volume_type>
            <volume_id>PS4VOLUME</volume_id>
            <volume_ts>2026-08-15 10:00:00</volume_ts>
            <package content_id="IV0001-GEOM00001_00-0000000000000000" passcode="00000000000000000000000000000000"/>
          </volume>
          <files img_no="0">
            <file name="eboot.bin" targ_path="eboot.bin"/>
            <dir d="sce_sys">
              <file name="sce_sys/param.sfo" targ_path="sce_sys/param.sfo"/>
              <file name="sce_sys/icon0.png" targ_path="sce_sys/icon0.png"/>
            </dir>
            <file name="index.html" targ_path="index.html"/>
            <file name="script.js" targ_path="script.js"/>
            <file name="style.css" targ_path="style.css"/>
          </files>
          <rootdir>
            <dir d="sce_sys"/>
          </rootdir>
        </ps4_project>
        EOF
        
        # 5. Criar o pacote e salvar
        mkdir -p output
        $OO_PS4_TOOLCHAIN/bin/linux/PkgTool.Core pkg_build GeometricWars.gp4 .
        mv *.pkg output/


    - name: Upload PKG
      uses: actions/upload-artifact@v4
      with:
        name: Boyceta-PS4-PKG
        path: output/*.pkg
        retention-days: 30
