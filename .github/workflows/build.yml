name: Build Boyceta PS4 PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Compiler
      run: sudo apt-get update && sudo apt-get install -y clang lld curl

    - name: Download OpenOrbis Toolchain
      run: |
        ASSET_URL=$(curl -s https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest | grep "browser_download_url" | grep -v ".exe" | grep -v ".pkg" | head -1 | cut -d '"' -f 4)
        curl -L "$ASSET_URL" -o toolchain.tar.gz
        mkdir -p $HOME/OpenOrbis
        tar -xzf toolchain.tar.gz -C $HOME/OpenOrbis --strip-components=1
        echo "OO_PS4_TOOLCHAIN=$HOME/OpenOrbis/PS4Toolchain" >> $GITHUB_ENV

    - name: Build eboot.bin
      run: |
        clang++ --target=x86_64-pc-freebsd12-elf -fPIC -funwind-tables -c -isysroot $OO_PS4_TOOLCHAIN -isystem $OO_PS4_TOOLCHAIN/include -isystem $OO_PS4_TOOLCHAIN/include/c++/v1 -o main.o src/main.cpp
        ld.lld -m elf_x86_64 -pie --script $OO_PS4_TOOLCHAIN/link.x --eh-frame-hdr -L$OO_PS4_TOOLCHAIN/lib -lc -lkernel -lc++ -lSceSystemService_stub_weak -lSceUserService_stub_weak $OO_PS4_TOOLCHAIN/lib/crt1.o main.o -o main.elf
        $OO_PS4_TOOLCHAIN/bin/linux/create-fself -in=main.elf -out=main.oelf --eboot "eboot.bin" --paid 0x3800000000000011

    - name: Download create-gp4
      run: |
        ASSET_URL=$(curl -s https://api.github.com/repos/OpenOrbis/create-gp4/releases/latest | grep "browser_download_url" | grep -i "linux" | head -1 | cut -d '"' -f 4)
        curl -L "$ASSET_URL" -o /usr/local/bin/create-gp4
        chmod +x /usr/local/bin/create-gp4

    - name: Create PKG
      run: |
        mkdir -p output
        create-gp4 \
          --content-id "IV0001-BOYC00001_00-0000000000000000" \
          --title "Boyceta PS4" \
          --title-id "BOYC00001" \
          --version "01.00" \
          --app-ver "01.00" \
          --target output/Boyceta-ps4.pkg \
          eboot.bin \
          sce_sys/param.sfo \
          sce_sys/keystone \
          sce_sys/icon0.png \
          Boyceta-ps4/index.html \
          Boyceta-ps4/script.js \
          Boyceta-ps4/style.css

    - name: Upload PKG
      uses: actions/upload-artifact@v4
      with:
        name: Boyceta-PS4-PKG
        path: output/Boyceta-ps4.pkg
        retention-days: 30
