name: Build Geometric Wars PS4 PKG

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN_VERSION: v0.5.4

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld curl jq ca-certificates make

      - name: Download OpenOrbis Toolchain
        shell: bash
        run: |
          set -euo pipefail

          release_api="https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/tags/${TOOLCHAIN_VERSION}"
          asset_url="$(curl -fsSL "$release_api" | jq -r '.assets[] | select(.name | test("\\.(tar\\.gz|tgz)$"; "i")) | .browser_download_url' | head -n 1)"

          if [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "OpenOrbis ${TOOLCHAIN_VERSION}: pacote Linux não encontrado."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/openorbis"
          curl -fL --retry 3 "$asset_url" -o "$RUNNER_TEMP/openorbis/toolchain.tar.gz"
          tar -xzf "$RUNNER_TEMP/openorbis/toolchain.tar.gz" -C "$RUNNER_TEMP/openorbis"

          create_fself="$(find "$RUNNER_TEMP/openorbis" -type f -path '*/bin/linux/create-fself' -print -quit)"
          if [ -z "$create_fself" ]; then
            echo "create-fself não foi encontrado no pacote baixado."
            exit 1
          fi

          toolchain_root="$(cd "$(dirname "$create_fself")/../.." && pwd)"
          echo "OO_PS4_TOOLCHAIN=$toolchain_root" >> "$GITHUB_ENV"
          chmod +x "$toolchain_root/bin/linux/"*

          test -x "$toolchain_root/bin/linux/create-fself"
          test -x "$toolchain_root/bin/linux/create-gp4"
          test -x "$toolchain_root/bin/linux/PkgTool.Core"

      - name: Verify project assets
        shell: bash
        run: |
          set -euo pipefail
          test -s src/main.cpp
          test -s sce_sys/icon0.png

      - name: Download official graphics helpers
        shell: bash
        run: |
          set -euo pipefail
          make helpers

      - name: Prepare required OpenOrbis module
        shell: bash
        run: |
          set -euo pipefail
          make sce_sys/about/right.sprx

      - name: Build eboot, GP4 and PKG
        shell: bash
        run: |
          set -euo pipefail
          make all

      - name: Collect and verify result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          pkg_file="IV0000-GEOM00001_00-GEOMETRICWARS000.pkg"
          test -s "$pkg_file"
          cp "$pkg_file" output/Geometric-Wars.pkg
          sha256sum output/Geometric-Wars.pkg > output/Geometric-Wars.pkg.sha256
          ls -lh output/Geometric-Wars.pkg
          cat output/Geometric-Wars.pkg.sha256

      - name: Upload final PKG
        uses: actions/upload-artifact@v4
        with:
          name: Geometric-Wars-PS4
          path: |
            output/Geometric-Wars.pkg
            output/Geometric-Wars.pkg.sha256
          if-no-files-found: error
          retention-days: 30

